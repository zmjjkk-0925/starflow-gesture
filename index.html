  <title>星流 · 手势粒子场</title>
  <style>

    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#030405; color:var(--ink); }
    body { touch-action:none; }
    button { font:inherit; }

    #camera { display:none; }

    .name { font-size:13px; font-weight:760; }
    .status { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; white-space:nowrap; }
    .status-dot { width:6px; height:6px; border-radius:50%; background:#5b6167; transition:background 180ms ease,box-shadow 180ms ease; }
    .status.live .status-dot { background:var(--active); box-shadow:0 0 10px rgba(131,244,230,.9); }

    .diffusion-option:hover,.diffusion-option[aria-pressed="true"] { transform:scale(1.1); border-color:#fff; background:rgba(255,255,255,.14); color:#fff; }

  </style>

    function updateParticles(){
